log:
  stdout: true
  level: info

# Built-in JWT Authorization
authorization:
  jwtKeyProvider:
    keySourceURIs:
      - "file:///etc/temporal/jwt/public-key.pem"  # Static public key
    refreshInterval: "1h"
  permissionsClaimName: "permissions"
  defaultUser: "default-user"
  systemUser: "temporal-system"
  # Built-in ClaimMapper
  claimMapper: "default"  # Use Temporal's built-in mapper

# Global TLS Configuration  
global:
  tls:
    internode:
      server:
        certFile: /etc/temporal/certs/temporal-server.pem
        keyFile: /etc/temporal/certs/temporal-server-key.pem
        requireClientAuth: true
        clientCAFiles: [/etc/temporal/certs/ca.pem]
      client:
        serverName: temporal-server
        rootCAFiles: [/etc/temporal/certs/ca.pem]
        certFile: /etc/temporal/certs/temporal-server.pem
        keyFile: /etc/temporal/certs/temporal-server-key.pem
    frontend:
      server:
        certFile: /etc/temporal/certs/temporal-server.pem
        keyFile: /etc/temporal/certs/temporal-server-key.pem
        requireClientAuth: true
        clientCAFiles: [/etc/temporal/certs/ca.pem]
      client:
        serverName: temporal-server
        rootCAFiles: [/etc/temporal/certs/ca.pem]
        certFile: /etc/temporal/certs/temporal-server.pem
        keyFile: /etc/temporal/certs/temporal-server-key.pem

# Services Configuration
services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnLocalHost: false
      bindOnIP: "0.0.0.0"
  
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnLocalHost: false
      bindOnIP: "0.0.0.0"
  
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnLocalHost: false
      bindOnIP: "0.0.0.0"
  
  worker:
    rpc:
      grpcPort: 7236
      membershipPort: 6936
      bindOnLocalHost: false
      bindOnIP: "0.0.0.0"

# Disable internal worker manager to prevent mTLS conflicts
workerManager:
  disable: true

# Persistence configuration
persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    default:
      sql:
        pluginName: "postgres"
        databaseName: "temporal"
        connectAddr: "postgresql:5432"
        connectProtocol: "tcp"
        user: "temporal"
        password: "temporal"
        maxConns: 20
        maxConnLifetime: "1h"
    visibility:
      sql:
        pluginName: "postgres"
        databaseName: "temporal_visibility"
        connectAddr: "postgresql:5432"
        connectProtocol: "tcp"
        user: "temporal"
        password: "temporal"
        maxConns: 20
        maxConnLifetime: "1h"

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: "active"
  currentClusterName: "active"
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: "frontend"
      rpcAddress: "127.0.0.1:7233"

dcRedirectionPolicy:
  policy: "noop"

archival:
  history:
    state: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
        outputDirectory: "/tmp/temporal_archival/development"
  visibility:
    state: "enabled"
    enableRead: true
    provider:
      filestore:
        fileMode: "0666"
        dirMode: "0766"
        outputDirectory: "/tmp/temporal_visibility_archival/development"

namespaceDefaults:
  archival:
    history:
      state: "enabled"
      URI: "file:///tmp/temporal_archival/development"
    visibility:
      state: "enabled"
      URI: "file:///tmp/temporal_visibility_archival/development"

publicClient:
  hostPort: "127.0.0.1:7233"

dynamicConfigClient:
  filepath: "/etc/temporal/config/custom/dynamicconfig"
  pollInterval: "10s"
