services:
  postgresql:
    image: postgres:15
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"
    networks: [temporal-network]
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  temporal-db-init:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal-db-init
    depends_on:
      - postgresql
    networks: [temporal-network]
    entrypoint: >
      sh -c '
        echo "Waiting for Postgres..." &&
        until temporal-sql-tool --plugin postgres12 --ep postgresql --port 5432 --u temporal --pw temporal --db temporal version >/dev/null 2>&1; do sleep 2; done &&
        echo "Setting up schemas..." &&
        temporal-sql-tool --plugin postgres12 --ep postgresql --port 5432 --u temporal --pw temporal --db temporal setup-schema -v 0.0 &&
        temporal-sql-tool --plugin postgres12 --ep postgresql --port 5432 --u temporal --pw temporal --db temporal update-schema -d /etc/temporal/schema/postgresql/v96 &&
        temporal-sql-tool --plugin postgres12 --ep postgresql --port 5432 --u temporal --pw temporal --db temporal create-cluster-metadata --cluster_name active --history_shard_count 4 || true &&
        temporal-sql-tool --plugin postgres12 --ep postgresql --port 5432 --u temporal --pw temporal --db temporal_visibility setup-schema -v 0.0 &&
        temporal-sql-tool --plugin postgres12 --ep postgresql --port 5432 --u temporal --pw temporal --db temporal_visibility update-schema -d /etc/temporal/schema/postgresql/v96
      '

  temporal:
    image: temporalio/server:1.24.2
    container_name: temporal
    depends_on:
      - postgresql
      - temporal-db-init
    networks: [temporal-network]
    ports:
      - "7233:7233"
      - "7234:7234"
    environment:
      - TEMPORAL_CONFIG_DIR=/etc/temporal/config/custom
      - TEMPORAL_ENVIRONMENT=development-ssl
    volumes:
      - ./temporal-config:/etc/temporal/config/custom
      - ./certs:/etc/temporal/certs:ro
      - ./src/auth:/etc/temporal/jwt:ro
    entrypoint: >
      sh -c "
        echo 'Waiting for Postgres...' &&
        until nc -z postgresql 5432; do sleep 1; done &&
        exec temporal-server --env development-ssl --config config/custom start
      "

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TEMPORAL_TLS_CA=/etc/temporal/certs/ca.pem
      - TEMPORAL_TLS_CERT=/etc/temporal/certs/worker-client.pem
      - TEMPORAL_TLS_KEY=/etc/temporal/certs/worker-client-key.pem
      - TEMPORAL_TLS_SERVER_NAME=temporal
    image: temporalio/admin-tools:1.22.0
    networks:
      - temporal-network
    volumes:
      - ./certs:/etc/temporal/certs:ro
    stdin_open: true
    tty: true

  temporal-web:
    container_name: temporal-web
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.28.0
    networks:
      - temporal-network
    ports:
      - "8234:8080"

volumes:
  postgresql-data:
  temporal-data:

networks:
  temporal-network:
    driver: bridge
    name: temporal-network