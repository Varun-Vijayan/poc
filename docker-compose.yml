version: '3.8'

services:
  # Temporal server with JWT authentication
  temporal:
    image: temporalio/auto-setup:1.22.0
    ports:
      - "0.0.0.0:7234:7233"   # Bind to all interfaces for remote access
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      # Enable JWT authentication
      - TEMPORAL_JWT_CLAIM_MAPPER=default
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_JWT_KEY_SOURCE_URIS=http://temporal:8080/jwks
    depends_on:
      - postgresql
      - jwt-server

  # Simple JWT server for testing
  jwt-server:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./jwt-config:/usr/share/nginx/html
    command: >
      sh -c "
      mkdir -p /usr/share/nginx/html &&
      cat > /usr/share/nginx/html/jwks <<EOF
      {
        \"keys\": [
          {
            \"kty\": \"RSA\",
            \"use\": \"sig\",
            \"kid\": \"temporal-key\",
            \"n\": \"0vx7agoebGcQSuuPiLJXZptN9nndrQmbXEps2aiAFbWhM78LhWx4cbbfAAtVT86zwu1RK7aPFFxuhDR1L6tSoc_BJECPebWKRXjBZCiFV4n3oknjhMstn64tZ_2W-5JsGY4Hc5n9yBXArwl93lqt7_RN5w6Cf0h4QyQ5v-65YGjQR0_FDW2QvzqY368QQMicAtaSqzs8KJZgnYb9c7d0zgdAZHzu6qMQvRL5hajrn1n91CbOpbISD08qNLyrdkt-bFTWhAI4vMQFh6WeZu0fM4lFd2NcRwr3XPksINHaQ-G_xBniIqbw0Ls1jF44-csFCur-kEgU8awapJzKnqDKgw\",
            \"e\": \"AQAB\"
          }
        ]
      }
      EOF
      nginx -g 'daemon off;'
      "

  # Temporal Web UI with auth
  temporal-web:
    image: temporalio/ui:2.21.3
    ports:
      - "0.0.0.0:8234:8080"   # Bind to all interfaces for remote access
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
      # Enable auth in UI
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_AUTH_PROVIDER_URL=http://jwt-server:80
    depends_on:
      - temporal

  # PostgreSQL database for Temporal
  postgresql:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"   # Changed from 5432 to 5433 to avoid conflicts
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  # Temporal Admin Tools (optional)
  temporal-admin-tools:
    image: temporalio/admin-tools:1.22.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true

volumes:
  postgresql-data:
  temporal-data: