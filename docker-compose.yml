version: '3.8'

services:
  # Temporal server with simple authentication
  temporal:
    image: temporalio/auto-setup:1.22.0
    ports:
      - "0.0.0.0:7234:7233"   # Bind to all interfaces for remote access
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      # Enable authentication with a simple setup
      - TEMPORAL_AUTH_ENABLED=true
      - TEMPORAL_CLI_SHOW_STACKS=1
    depends_on:
      - postgresql

  # Temporal Web UI with auth
  temporal-web:
    image: temporalio/ui:2.21.3
    ports:
      - "0.0.0.0:8234:8080"   # Bind to all interfaces for remote access
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  # PostgreSQL database for Temporal
  postgresql:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"   # Changed from 5432 to 5433 to avoid conflicts
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  # Temporal Admin Tools (optional)
  temporal-admin-tools:
    image: temporalio/admin-tools:1.22.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true

volumes:
  postgresql-data:
  temporal-data: