version: '3.8'

services:
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    image: postgres:13
    networks:
      - temporal-network
    ports:
      - "5433:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    depends_on:
      - postgresql
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - ENABLE_ES=false
      - ES_SEEDS=
      - ES_VERSION=v7
      - TLS=true
      - TLS_REQUIRE_CLIENT_AUTH=true
    image: temporalio/auto-setup:1.22.0
    networks:
      - temporal-network
    ports:
      - "7233:7233"
      - "7234:7234"
    volumes:
      - ./temporal-config:/etc/temporal/config/custom
      - ./certs:/etc/temporal/certs:ro
      - ./src/auth:/etc/temporal/jwt:ro
    entrypoint: >
      sh -c "
        echo '🚀 Starting Temporal with mTLS + JWT Authentication' &&
        echo '⏳ Waiting for PostgreSQL and JWT server...' &&
        sleep 10 &&
        echo '📁 Config directory contents:' &&
        ls -la /etc/temporal/config/custom/ &&
        echo '🔐 SSL certificates:' &&
        ls -la /etc/temporal/certs/ &&
        echo '🔑 Starting server with development-ssl config...' &&
        export TEMPORAL_CONFIG_DIR=/etc/temporal/config/custom &&
        export TEMPORAL_ENVIRONMENT=development-ssl &&
        cd /etc/temporal &&
        exec temporal-server --env development-ssl --config config/custom start
      "

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
      - TEMPORAL_TLS_CA=/etc/temporal/certs/ca.pem
      - TEMPORAL_TLS_CERT=/etc/temporal/certs/worker-client.pem
      - TEMPORAL_TLS_KEY=/etc/temporal/certs/worker-client-key.pem
      - TEMPORAL_TLS_SERVER_NAME=temporal
    image: temporalio/admin-tools:1.22.0
    networks:
      - temporal-network
    volumes:
      - ./certs:/etc/temporal/certs:ro
    stdin_open: true
    tty: true

  temporal-web:
    container_name: temporal-web
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.21.3
    networks:
      - temporal-network
    ports:
      - "8234:8080"

volumes:
  postgresql-data:
  temporal-data:

networks:
  temporal-network:
    driver: bridge
    name: temporal-network