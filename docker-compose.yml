version: '3.8'

services:
  postgresql:
    container_name: temporal-postgresql
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    image: postgres:13
    networks:
      - temporal-network
    ports:
      - "5433:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  temporal:
    container_name: temporal
    depends_on:
      - postgresql
      - jwt-server
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - ENABLE_ES=false
      - ES_SEEDS=
      - ES_VERSION=v7
    image: temporalio/auto-setup:1.22.0
    networks:
      - temporal-network
    ports:
      - "7233:7233"  # Fixed: Remove 0.0.0.0 binding for Codespaces
      - "7234:7234"
    volumes:
      - ./temporal-config:/etc/temporal/config/custom
      - ./certs:/etc/temporal/certs:ro
    entrypoint: >
      sh -c "
        echo '🚀 Starting Temporal Server (Production-like with mTLS + JWT)' &&
        echo '⏳ Waiting for PostgreSQL and JWT server...' &&
        sleep 10 &&
        echo '📁 Config directory contents:' &&
        ls -la /etc/temporal/config/custom/ &&
        echo '🔐 SSL certificates:' &&
        ls -la /etc/temporal/certs/ &&
        echo '🔑 Starting server with development-ssl config...' &&
        export TEMPORAL_CONFIG_DIR=/etc/temporal/config/custom &&
        export TEMPORAL_ENVIRONMENT=development-ssl &&
        cd /etc/temporal &&
        exec temporal-server --env development-ssl --config config/custom start
      "

  temporal-admin-tools:
    container_name: temporal-admin-tools
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    image: temporalio/admin-tools:1.22.0
    networks:
      - temporal-network
    stdin_open: true
    tty: true

  temporal-web:
    container_name: temporal-web
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    image: temporalio/ui:2.21.3
    networks:
      - temporal-network
    ports:
      - "8234:8080"

  jwt-server:
    image: nginx:alpine
    container_name: jwt-server
    networks:
      - temporal-network
    ports:
      - "8080:80"
    volumes:
      - ./temporal-config:/usr/share/nginx/html:ro
    command: >
      sh -c "
        echo '🔑 Starting JWT JWKS Server...' &&
        echo 'Creating JWKS endpoint at /jwks' &&
        if [ -f /usr/share/nginx/html/jwks ]; then
          echo '✅ JWKS file found, contents:' &&
          cat /usr/share/nginx/html/jwks
        else
          echo '❌ JWKS file not found! Creating placeholder...' &&
          echo '{\"keys\":[]}' > /usr/share/nginx/html/jwks
        fi &&
        nginx -g 'daemon off;'
      "

volumes:
  postgresql-data:
  temporal-data:

networks:
  temporal-network:
    driver: bridge
    name: temporal-network