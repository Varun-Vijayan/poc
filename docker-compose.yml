version: '3.8'

services:
  # Temporal server with config file authentication
  temporal:
    image: temporalio/auto-setup:1.22.0
    ports:
      - "0.0.0.0:7234:7233"   # Bind to all interfaces for remote access
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - TEMPORAL_CLI_ADDRESS=0.0.0.0:7233
      - TEMPORAL_CONFIG_DIR=custom
      - TEMPORAL_ENVIRONMENT=development
      - TEMPORAL_ROOT=/etc/temporal
    volumes:
      - ./temporal-config:/etc/temporal/custom
    entrypoint: >
      sh -c "
      echo 'Loading custom Temporal configuration...' &&
      ls -la /etc/temporal/custom/ &&
      echo 'Config file contents (first 20 lines):' &&
      head -20 /etc/temporal/custom/config.yaml &&
      echo 'Environment variables:' &&
      echo 'TEMPORAL_ROOT=/etc/temporal' &&
      echo 'TEMPORAL_CONFIG_DIR=custom' &&
      echo 'TEMPORAL_ENVIRONMENT=development' &&
      echo 'Starting Temporal server with environment config...' &&
      cd /etc/temporal &&
      exec temporal-server start
      "
    depends_on:
      - postgresql

  # Temporal Web UI
  temporal-web:
    image: temporalio/ui:2.21.3
    ports:
      - "0.0.0.0:8234:8080"   # Bind to all interfaces for remote access
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal

  # PostgreSQL database for Temporal
  postgresql:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5433:5432"   # Changed from 5432 to 5433 to avoid conflicts
    volumes:
      - postgresql-data:/var/lib/postgresql/data

  # Temporal Admin Tools (optional)
  temporal-admin-tools:
    image: temporalio/admin-tools:1.22.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true

volumes:
  postgresql-data:
  temporal-data: